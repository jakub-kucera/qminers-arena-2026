# arena_sim/: the Rust port of the Arena's exchange simulator (simulator/ at the repository root) and its strategies.
# The Rust twins of the Prosperity-era engine and bots (the crate arena_rs) are in the prep repository.
[workspace]
members = ["arena_sim"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
